# Staging op *.pardodesign.app mag NIET geindexeerd worden; een echt domein
# krijgt geen header (lege map-waarde = header weggelaten). Zo kan dezelfde
# image later veilig naar productie.
map $host $robots_header {
    default "";
    "~\.pardodesign\.app$" "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag $robots_header always;

    location / {
        try_files $uri $uri/ =404;
    }
}
