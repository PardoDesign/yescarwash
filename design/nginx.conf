# Staging op *.pardodesign.app mag NIET geindexeerd worden; een echt domein
# krijgt geen header (lege map-waarde = header weggelaten). Zo kan dezelfde
# image later veilig naar productie.
map $host $robots_header {
    default "";
    "~\.pardodesign\.app$" "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx erft add_header NIET in een location die zelf add_header gebruikt.
    # Daarom staat de set in beide blokken.
    location / {
        try_files $uri $uri/ =404;

        # HTML altijd hervalideren: anders blijft een bezoeker na een deploy naar
        # de oude pagina kijken, en dus ook naar de oude CSS-versie.
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # Google Fonts is de enige externe herkomst; inline style/script zijn de
        # druppelposities en het mobiele menu op deze statische pagina.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Stijl en script ALTIJD laten hervalideren. Ze stonden op 30 dagen met een
    # versie-query in de HTML als sleutel, maar dan hangt een correcte pagina af
    # van het handmatig ophogen van die query; vergeet je dat een keer, dan
    # krijgt de bezoeker nieuwe HTML met oude opmaak (gebeurd op 01-08). Met
    # no-cache blijft de ETag het werk doen: ongewijzigd is een 304 van een paar
    # honderd bytes, gewijzigd komt altijd door.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Beeld en lettertypes veranderen zelden en krijgen bij vervanging een
    # nieuwe bestandsnaam, dus die mogen wel lang blijven staan.
    location ~* \.(png|jpe?g|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
